name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linting
        run: yarn lint

      - name: Check TypeScript types
        run: yarn lint:diagnostics

      - name: Run tests
        run: yarn test --coverage

      - name: Check for unused exports
        run: yarn knip

      - name: Build project
        run: yarn build

      - name: Test CLI functionality
        run: |
          # Test CLI can be invoked
          node dist/bin/carrotly.js --help
          # Test version command
          node dist/bin/carrotly.js --version

      - name: Upload coverage to Codecov
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint-commits:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint commit messages
        run: |
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.sha }} --verbose

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run security audit
        run: yarn audit --level moderate

      - name: Run npm audit
        run: npm audit --audit-level moderate

  compatibility:
    name: Package Compatibility
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build

      - name: Pack and test package
        run: |
          yarn pack
          # Test that the package can be installed
          npm install -g ./carrotly-cli-*.tgz
          # Test global installation works
          carrotly --version
          carrotly --help

      - name: Test project generation
        run: |
          # Test creating a new project
          mkdir test-output
          cd test-output
          carrotly new test-app --skip-prompts --api graphql --orm mongoose
          cd test-app
          # Verify generated files exist
          test -f package.json
          test -f src/main.ts
          test -f .carrotly.json
          # Test that generated project can install deps
          yarn install
          # Test that generated project can build
          yarn build
